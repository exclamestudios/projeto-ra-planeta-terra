<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style"
        content="black-translucent">
  <title>Planeta Terra – AR</title>
  <!-- CSS MindAR (jsDelivr, com CORS ok) -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image.prod.css"
  />
  <!-- Import Map para módulos ES -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.148.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.148.0/examples/jsm/",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-three.prod.js"
    }
  }
  </script>
  <style>
    body, html {
      margin: 0; overflow: hidden;
      width:100%; height:100%; position:fixed;
    }
    #startButton {
      position:absolute; top:50%; left:50%;
      transform:translate(-50%,-50%);
      padding:15px 30px; font-size:18px;
      background:#007AFF; color:#fff; border:none;
      border-radius:10px; font-family:-apple-system,sans-serif;
      cursor:pointer; z-index:1000;
    }
    #descricao, #loading {
      position:absolute; left:50%; transform:translateX(-50%);
      padding:12px; background:rgba(0,0,0,0.7);
      color:#fff; font-family:-apple-system,sans-serif;
      border-radius:10px; text-align:center; z-index:500;
      font-size:16px;
    }
    #descricao {
      bottom:20px; opacity:0; transition:opacity .5s;
      width:80%;
    }
    #loading {
      top:20px; display:none; width:auto;
    }
    #arView {
      display:none; width:100%; height:100%;
    }
    .a-canvas {
      width:100%!important; height:100%!important;
    }
  </style>
</head>
<body>
  <button id="startButton">Iniciar Realidade Aumentada</button>
  <div id="arView"></div>
  <div id="descricao">A Terra gira em torno do Sol a 107.000 km/h!</div>
  <div id="loading">🔍 Procurando marcador...</div>
  <!-- só o seu código em main.js como módulo -->
  <script type="module" src="./main.js"></script>
</body>
</html>
