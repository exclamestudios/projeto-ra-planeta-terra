<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Planeta Terra – AR</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.137.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.137.0/examples/jsm/",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-three.prod.js"
    }
  }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    body, html { 
      margin: 0; 
      overflow: hidden;
      width: 100%;
      height: 100%;
      position: fixed;
    }
    #startButton {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 15px 30px;
      font-size: 18px;
      background: #007AFF;
      color: white;
      border: none;
      border-radius: 10px;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      cursor: pointer;
      z-index: 1000;
    }
    #startButton:active {
      background: #0056b3;
    }
    #descricao {
      position: absolute;
      bottom: 20px;
      left: 20px;
      right: 20px;
      padding: 12px;
      background: rgba(0,0,0,0.7);
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      opacity: 0;
      transition: opacity 0.5s;
      border-radius: 10px;
      text-align: center;
      font-size: 16px;
      z-index: 500;
    }
    #loading {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px;
      background: rgba(0,0,0,0.7);
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      border-radius: 10px;
      font-size: 16px;
      display: none;
      z-index: 500;
    }
    #arView {
      display: none;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="arView"></div>
  <div id="loading">Carregando...</div>
  <div id="descricao">
    <h1>Planeta Terra</h1>
    <p>O único planeta conhecido com vida</p>
  </div>
  <div id="audioControls">
    <button id="playButton" class="audio-button">
      <span class="play-icon">▶️</span>
      <span class="pause-icon" style="display: none;">⏸️</span>
    </button>
  </div>
  <button id="startButton">Iniciar AR</button>
  <script type="module" src="main.js"></script>
</body>
</html>
